{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2>Your Chat Rooms</h2>
    <ul class="list-group">
        {% for room in rooms %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'user_messages:chat_room' room.id %}">{{ room.name }}</a>
            <span class="badge bg-primary rounded-pill">{{ room.participants.count }} members</span>
        </li>
        {% empty %}
        <li class="list-group-item">You are not in any chat rooms yet.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
