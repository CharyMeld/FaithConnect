{% extends "base.html" %}

{% block content %}
<h1>Start One-on-One Chat</h1>

<form method="post">
  {% csrf_token %}
  <label for="user_id">Select User to Chat With:</label>
  <select name="user_id" id="user_id" required>
    {% for user in users %}
      <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }}</option>
    {% endfor %}
  </select>
  <button type="submit">Start Chat</button>
</form>
{% endblock %}
