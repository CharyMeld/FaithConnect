{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-lg rounded-4">
        <div class="card-header bg-primary text-white text-center">
            <h2>Create a New Post</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <!-- Hidden file input (single at a time per category) -->
                <input id="mediaFiles" name="media_files" type="file" style="display: none;" />

                <div class="mb-4 text-center">
                    <button type="button" class="btn btn-outline-primary mx-2" onclick="triggerFileUpload('image')">
                        📷 Image
                    </button>
                    <button type="button" class="btn btn-outline-success mx-2" onclick="triggerFileUpload('video')">
                        🎬 Video
                    </button>
                    <button type="button" class="btn btn-outline-warning mx-2" onclick="triggerFileUpload('file')">
                        📄 File
                    </button>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'post:post_list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-send-check"></i> Post
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function triggerFileUpload(type) {
        const input = document.getElementById('mediaFiles');
        input.value = '';  // Clear previous selection

        if (type === 'image') {
            input.accept = 'image/*';
        } else if (type === 'video') {
            input.accept = 'video/*';
        } else if (type === 'file') {
            input.accept = '.pdf,.doc,.docx,.ppt,.xls,.xlsx';
        } else {
            input.accept = '';
        }

        input.click();
    }
</script>
{% endblock %}
