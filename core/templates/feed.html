{% extends 'base.html' %}

{% block content %}
<h2>Feed</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Post</button>
</form>

<ul>
    {% for post in posts %}
        <li><strong>{{ post.user.username }}</strong>: {{ post.content }} ({{ post.created_at }})</li>
    {% endfor %}
</ul>
{% endblock %}
